name: CI & IAM Least Privilege Auditor
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Unit Tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Execute Policy Audit
        run: python iam_auditor.py --policy samples/vulnerable_iam_policy.json
